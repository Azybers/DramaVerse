<!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>DramaVerse — Asian Drama & Movie Hub</title>
     <link rel="stylesheet" href="style.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
 </head>
 <body>
     <!-- Header -->
     <header>
         <div class="container">
             <h1 class="logo">🎬 DramaVerse</h1>
             <nav>
                 <button class="nav-btn active" data-category="all">All</button>
                 <button class="nav-btn" data-category="korean-drama">K-Dramas</button>
                 <button class="nav-btn" data-category="korean-movie">K-Movies</button>
                 <button class="nav-btn" data-category="chinese-drama">C-Dramas</button>
                 <button class="nav-btn" data-category="chinese-movie">C-Movies</button>
             </nav>
         </div>
     </header>
     <!-- Search & Add Section -->
     <section class="controls">
         <div class="container">
             <input type="text" id="search-input" placeholder="Search dramas & movies...">
             <button id="open-add-modal" class="add-btn">+ Add New</button>
         </div>
     </section>
     <!-- Main Content -->
     <main class="container">
         <h2 id="section-title">All Collection</h2>
         <p id="total-count">Total: <span>100</span> items</p>
         
         <div id="playlist-grid" class="playlist-grid">
             <!-- Items will load here via JavaScript -->
         </div>
     </main>
     <!-- Add New Modal -->
     <div id="add-modal" class="modal">
         <div class="modal-content">
             <span class="close-btn">&times;</span>
             <h3>Add New to DramaVerse</h3>
             <form id="add-form">
                 <div class="form-group">
                     <label for="item-title">Title *</label>
                     <input type="text" id="item-title" required>
                 </div>
                 <div class="form-group">
                     <label for="item-category">Category *</label>
                     <select id="item-category" required>
                         <option value="">Select category</option>
                         <option value="korean-drama">Korean Drama</option>
                         <option value="korean-movie">Korean Movie</option>
                         <option value="chinese-drama">Chinese Drama</option>
                         <option value="chinese-movie">Chinese Movie</option>
                     </select>
                 </div>
                 <div class="form-group">
                     <label for="item-year">Year</label>
                     <input type="number" id="item-year" min="1990" max="2030">
                 </div>
                 <div class="form-group">
                     <label for="item-rating">Rating (1-10)</label>
                     <input type="number" id="item-rating" min="1" max="10" step="0.1">
                 </div>
                 <div class="form-group">
                     <label for="item-link">Watch Link (optional)</label>
                     <input type="url" id="item-link">
                 </div>
                 <button type="submit" class="submit-btn">Add to Playlist</button>
             </form>
         </div>
     </div>
     <!-- Footer -->
     <footer>
         <div class="container">
             <p>© 2026 DramaVerse — Your Asian Drama & Movie Hub ❤️</p>
         </div>
     </footer>
     <script src="script.js"></script>
 </body>
 </html>
